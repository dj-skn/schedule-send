name: Vulnerabilities

# Weekly, so a newly published vulnerability the program reaches turns this
# red without a push; CI runs the same scan on every push. It is its own
# workflow because GitHub disables a scheduled workflow after 60 days without
# repository activity, which here stops only this one. Re-enable it with
# `gh workflow enable vulnerabilities.yml`.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The newest stable Go; go.mod names only the oldest that builds.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: govulncheck
        run: tools/vulncheck
