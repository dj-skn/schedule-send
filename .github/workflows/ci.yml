name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs these same checks before it publishes anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # No commit this run adds may carry a Co-authored-by trailer: a pull
      # request's own commits, a push's new ones, or for a run started by
      # hand what is not on main. A push whose old head is gone checks its
      # new head alone.
      - name: No co-author trailers
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) range="$BASE..$HEAD" ;;
            push)
              if git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
                range="$BEFORE..$GITHUB_SHA"
              else
                range="$GITHUB_SHA^!"
              fi ;;
            *) range="origin/main..HEAD" ;;
          esac
          tools/check-trailers "$range"
      # The newest stable Go; go.mod names only the oldest that builds.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      # The gate and parity are zsh scripts; the stand-ins need jq.
      - name: Install zsh and jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh jq

      # The plugin test checks the manifest with the current Herdr release.
      - name: Install Herdr
        run: |
          curl -fsSL https://herdr.dev/install.sh | HERDR_INSTALL_DIR="$RUNNER_TEMP/herdr" sh
          echo "$RUNNER_TEMP/herdr" >> "$GITHUB_PATH"

      - name: Gate
        run: tools/check
      - name: Parity with the zsh version
        run: tools/parity
      - name: Install script
        run: tools/install-smoke
      - name: Herdr plugin
        run: tools/plugin-smoke

  linux-arm:
    name: Linux ARM
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - name: Tests
        run: go test -count=1 ./...
      # Builds both archives and installs the one for this machine, so the
      # ARM binary is run, not only built.
      - name: Install script
        run: tools/install-smoke

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      # A runner's Homebrew can be older than the tap rules users will meet.
      - name: Update Homebrew and install GNU date and jq
        run: |
          brew update > /dev/null
          brew --version
          brew install coreutils jq
      - name: Install Herdr
        run: |
          curl -fsSL https://herdr.dev/install.sh | HERDR_INSTALL_DIR="$RUNNER_TEMP/herdr" sh
          echo "$RUNNER_TEMP/herdr" >> "$GITHUB_PATH"

      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test -count=1 ./...
      - name: Herdr plugin
        run: tools/plugin-smoke
      # These two arm real jobs and install with Homebrew, on the runner only.
      - name: Homebrew formula
        run: tools/brew-smoke
      - name: Real launchd jobs
        run: tools/launchd-smoke
        env:
          LAUNCHD_SMOKE_RECORDS: "1"

  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # Known vulnerabilities the program reaches, for both builds, including
      # the Go standard library, which Dependabot does not cover. The weekly
      # run is vulnerabilities.yml.
      - name: govulncheck
        run: tools/vulncheck
