# Dependabot's patch and minor updates merge themselves: this turns on
# auto-merge, and the ruleset on main holds the merge until CI's required
# checks pass. A major waits for the owner, since CI does not run the
# release's own jobs. The metadata step refuses a pull request whose commits
# Dependabot did not make.
name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  auto-merge:
    name: Auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'dj-skn/schedule-send'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read the update
        id: update
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Merge it once CI passes
        if: steps.update.outputs.update-type == 'version-update:semver-patch' || steps.update.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
