<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title">
  <title id="title">How schedule-send works: schedule, wait on a system timer, deliver</title>
  <!-- The light variant. how-it-works-dark.svg is the same drawing in the dark palette; change both. -->
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; }
    .step { font-size: 19px; font-weight: 600; }
    .head { font-size: 15px; font-weight: 600; }
    .body { font-size: 14px; fill: #59636e; }
    .body .mono { fill: #1f2328; }
    .num { font-size: 15px; font-weight: 700; fill: #ffffff; }
    .card { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1; }
    .arrow { stroke: #818b98; stroke-width: 2; fill: none; }
    .head-arrow { fill: #818b98; }
    .a1 { fill: #0969da; } .a2 { fill: #9a6700; } .a3 { fill: #1a7f37; }
  </style>
  <defs>
    <clipPath id="card"><rect x="0.5" y="0.5" width="300" height="243" rx="12"/></clipPath>
  </defs>
  <g transform="translate(8 8)">
    <rect class="card" x="0.5" y="0.5" width="300" height="243" rx="12"/>
    <rect class="a1" x="0.5" y="0.5" width="300" height="5" clip-path="url(#card)"/>
    <circle class="a1" cx="40" cy="44" r="15"/>
    <text class="num" x="40" y="49.5" text-anchor="middle">1</text>
    <text class="step" x="66" y="51">Schedule</text>
    <text class="head" x="25" y="100">Pick an agent and a time</text>
    <circle class="a1" cx="29" cy="133" r="3"/>
    <text class="body" x="42" y="138">Picker, <tspan class="mono">--cwd</tspan> or <tspan class="mono">--pane</tspan></text>
    <circle class="a1" cx="29" cy="165" r="3"/>
    <text class="body" x="42" y="170">Reads a usage-limit notice</text>
    <circle class="a1" cx="29" cy="197" r="3"/>
    <text class="body" x="42" y="202">Proposes the reset + 1 min</text>
  </g>
  <g transform="translate(350 8)">
    <rect class="card" x="0.5" y="0.5" width="300" height="243" rx="12"/>
    <rect class="a2" x="0.5" y="0.5" width="300" height="5" clip-path="url(#card)"/>
    <circle class="a2" cx="40" cy="44" r="15"/>
    <text class="num" x="40" y="49.5" text-anchor="middle">2</text>
    <text class="step" x="66" y="51">Wait</text>
    <text class="head" x="25" y="100">A system timer holds the job</text>
    <circle class="a2" cx="29" cy="133" r="3"/>
    <text class="body" x="42" y="138">systemd user timer on Linux</text>
    <circle class="a2" cx="29" cy="165" r="3"/>
    <text class="body" x="42" y="170">launchd agent on macOS</text>
    <circle class="a2" cx="29" cy="197" r="3"/>
    <text class="body" x="42" y="202">Your terminal can close</text>
  </g>
  <g transform="translate(692 8)">
    <rect class="card" x="0.5" y="0.5" width="300" height="243" rx="12"/>
    <rect class="a3" x="0.5" y="0.5" width="300" height="5" clip-path="url(#card)"/>
    <circle class="a3" cx="40" cy="44" r="15"/>
    <text class="num" x="40" y="49.5" text-anchor="middle">3</text>
    <text class="step" x="66" y="51">Deliver</text>
    <text class="head" x="25" y="100">Sent once, then confirmed</text>
    <circle class="a3" cx="29" cy="133" r="3"/>
    <text class="body" x="42" y="138">Rechecks pane, agent, folder</text>
    <circle class="a3" cx="29" cy="165" r="3"/>
    <text class="body" x="42" y="170">Waits while the agent is busy</text>
    <circle class="a3" cx="29" cy="197" r="3"/>
    <text class="body" x="42" y="202">Confirms the agent took it</text>
  </g>
  <path class="arrow" d="M316 130 H334"/>
  <path class="head-arrow" d="M342 130 l-9 -6 v12 z"/>
  <path class="arrow" d="M658 130 H676"/>
  <path class="head-arrow" d="M684 130 l-9 -6 v12 z"/>
</svg>
